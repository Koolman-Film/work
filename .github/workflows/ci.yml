# CI pipeline — runs on every push to main + every PR.
#
# Why this set of jobs:
#   - Catches what local pre-commit hooks can't (e.g., tests that fail only
#     in CI environment, or developers using SKIP_SIMPLE_GIT_HOOKS).
#   - Build job validates Next.js compiles end-to-end + Prisma client
#     generates from the committed schema.
#
# We run jobs in parallel where they're independent (lint + typecheck +
# test don't depend on each other) so total wall time stays under 2 min.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Pinned Node to match local development. pnpm version comes from the
  # `packageManager` field in package.json (pnpm/action-setup@v4 reads it;
  # passing an explicit `version:` too triggers ERR_PNPM_BAD_PM_VERSION).
  NODE_VERSION: '24'

jobs:
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Type-check (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Prisma's generated types are required for `tsc` — without this,
      # any import from @prisma/client fails with "module has no exports."
      - run: pnpm prisma generate
      - run: pnpm typecheck

  test:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm test

  integration:
    name: Integration tests (Vitest + Postgres)
    runs-on: ubuntu-latest
    # A throwaway Postgres for the service-flow tests (payroll run/publish,
    # advance balance, OT candidates). The Prisma migrations are vanilla-PG
    # compatible (Supabase Storage RLS lives outside them), so a plain image
    # works. Mirrors the local koolman_test DB.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: koolman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/koolman_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      # Apply the schema to the throwaway DB, then run the integration suite.
      - run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}
      - run: pnpm test:integration

  build:
    name: Build (Next.js) + function-size check
    runs-on: ubuntu-latest
    # Don't burn CI minutes on a build if the earlier jobs already failed.
    needs: [lint, typecheck, test, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm build
        env:
          # Build-time env stubs — Next inlines NEXT_PUBLIC_* at build,
          # so even production builds need *some* value here. Fake values
          # are fine because CI never executes user-facing requests.
          NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'placeholder-anon-key-for-build-only'
          NEXT_PUBLIC_LIFF_ID: 'placeholder-liff-id'
          PAIRING_JWT_SECRET: 'placeholder-secret-32chars-for-build-only-xx'

      # Size-check the serverless functions from the build we just produced.
      #
      # This exists because a deploy failed at 257.76 MB against Vercel's
      # 250 MB cap, and nothing before the deploy could have caught it: the
      # cause was outputFileTracingIncludes shipping chromium under two globs,
      # which is invisible to lint, tsc and every test — they all run against
      # local node_modules where both paths exist.
      #
      # It asserts BOTH directions. Over-inclusion fails the deploy loudly;
      # under-inclusion (a PDF route losing the binary) fails *silently* at
      # runtime, which is how the payslip warm stayed broken for 53
      # occurrences without anyone noticing.
      #
      # Runs in this job, not its own, because it reads .next/server — moving
      # it elsewhere would mean rebuilding or uploading the output as an
      # artifact for no benefit.
      - run: pnpm check:bundle

  e2e:
    name: E2E (Playwright + Supabase)
    runs-on: ubuntu-latest
    # Last and gated: it is the slowest job by far, and there is no value in
    # standing up Supabase to exercise code that does not compile.
    needs: [lint, typecheck, test, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate

      # The e2e specs sign in through the real /login form, which performs a
      # Supabase password grant — a bare Postgres service (what the integration
      # job uses) cannot serve that. So CI runs the same local stack developers
      # do, from the committed supabase/config.toml.
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start

      # Reconstruct .env.local from the stack the CLI just brought up. The seed
      # scripts read it via `dotenv -e .env.local`, and Next picks it up for the
      # server Playwright starts, so writing it once feeds both.
      #
      # The keys are local-only defaults the CLI derives from its default JWT
      # secret — identical on every machine, and worthless against anything but
      # this throwaway container. Read from `supabase status` rather than
      # hardcoded so a CLI change cannot silently desync them.
      - name: Write .env.local from the local stack
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          DB="postgresql://postgres:postgres@127.0.0.1:54422/postgres"
          cat > .env.local <<EOF
          DATABASE_URL="$DB"
          DIRECT_URL="$DB"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          SUPABASE_URL="$API_URL"
          SUPABASE_SECRET_KEY="$SERVICE_ROLE_KEY"
          SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          PAIRING_JWT_SECRET="ci-only-pairing-secret-32-chars-minimum-xx"
          NEXT_PUBLIC_LIFF_ID="ci-placeholder-liff-id"
          E2E_TEST_LOGIN="1"
          EOF
          echo "wrote .env.local (${API_URL})"

      - run: pnpm db:deploy

      # Seed order matters: db:seed creates the auth users every spec logs in
      # as, and the rest layer demo data that forms rely on (a branch to pick,
      # a bank, a work schedule). Skipping any of them fails specs on missing
      # <option>s rather than on the behaviour under test.
      - name: Seed
        run: |
          set -euo pipefail
          pnpm db:seed
          pnpm db:seed:banks
          pnpm db:seed:employees
          pnpm db:seed:leave-advance
          pnpm db:seed:attendance

      - run: pnpm exec playwright install --with-deps chromium

      # playwright.config's webServer builds and starts the app itself; under
      # CI it uses `next build && next start` rather than `next dev`.
      - run: pnpm exec playwright test
        env:
          NODE_OPTIONS: '--import ./tests/e2e/fix-next-subpath-resolution.mjs'

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
